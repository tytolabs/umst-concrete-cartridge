# macOS convenience aliases.
#
# `mac-fast` is the umbrella feature combining `solver-experimental` + `render` + `blas-accelerate`.
# Apple Accelerate (vecLib) auto-threads BLAS across the M-series P-cores, so PCG / matmul-heavy
# paths use real silicon parallelism instead of running single-threaded.
#
#   cargo mt-test                   # run the workspace tests with Accelerate on
#   cargo mt-build                  # release build with Accelerate
#   cargo mt-shell                  # run the Striatus shell demo with Accelerate
#
# On Linux / CI, drop `--features mac-fast` and use `--features solver-experimental` directly;
# Accelerate is macOS-only.

[alias]
mt        = "--features mac-fast"
mt-test   = "test --features mac-fast"
mt-build  = "build --features mac-fast --release"
mt-check  = "check --features mac-fast"
mt-shell  = "run --release -p umst-concrete-cartridge --example optimize_shell_3d --features mac-fast"

# MaOS monorepo: patch git dep to sibling checkout (see config.toml.example).
[patch."https://github.com/tytolabs/umst-manifold.git"]
umst-manifold = { path = "../umst-manifold" }
