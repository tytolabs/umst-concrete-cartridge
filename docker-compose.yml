# Stdio MCP: keep stdin_open + tty when attaching from a compose shell.

services:
  umst-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    volumes:
      - ./calibration:/srv/calibration:ro
