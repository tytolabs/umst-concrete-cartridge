[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "umst-concrete-cartridge"
version = "0.2.1"
description = "Python bindings for the UMST concrete cartridge (predict, CSV audit, certify, SSOT schemas)."
readme = "../../README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Santhosh Shyamsundar" },
  { name = "Santosh Prabhu Shenbagamoorthy" },
]

[project.urls]
Repository = "https://github.com/tytolabs/umst-concrete-cartridge"

[project.optional-dependencies]
notebook = ["notebook>=7", "jupyterlab>=4", "matplotlib>=3.7", "pandas>=2.0"]
tests = ["hypothesis>=6,<7"]

[tool.maturin]
python-source = "python"
module-name   = "umst_concrete_cartridge._umst_concrete_cartridge"
features      = ["pyo3/extension-module"]
