[package]
name = "umst-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 extension for UMST concrete cartridge wire APIs."
publish = false

[features]
default = []
blas-accelerate = ["umst-cli/blas-accelerate"]

[lib]
name = "_umst_concrete_cartridge"
crate-type = ["cdylib"]

[dependencies]
umst-concrete-cartridge = { path = "../umst-concrete-cartridge" }
umst-cli = { path = "../umst-cli" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
serde_json = "1.0"
csv = "1.4"

[build-dependencies]
pyo3-build-config = "0.28"
