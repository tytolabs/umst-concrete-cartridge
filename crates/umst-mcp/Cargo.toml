# Stdio MCP server: sync JSON-RPC over lines; depends on `umst-cli` transport + `umst-concrete-cartridge` façade.

[package]
name = "umst-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol (MCP) server exposing the UMST concrete engine to AI agents."
publish = false

[features]
default = []
blas-accelerate = ["umst-cli/blas-accelerate"]

[dependencies]
umst-concrete-cartridge = { path = "../umst-concrete-cartridge" }
umst-cli = { path = "../umst-cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

