# Stdio MCP server: sync JSON-RPC over lines; depends on `umst-cli` transport + `umst-concrete-cartridge` façade.

[package]
name = "umst-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol (MCP) server exposing the UMST concrete engine to AI agents."
publish = false

[lib]
name = "umst_mcp"
path = "src/lib.rs"

[[bin]]
name = "umst-mcp"
path = "src/main.rs"

[features]
default = []
blas-accelerate = ["umst-cli/blas-accelerate"]
agent-layer = ["umst-cli/agent-layer", "umst-concrete-cartridge/agent-layer"]
ucrs-provenance = ["umst-concrete-cartridge/ucrs-provenance"]

[dependencies]
umst-concrete-cartridge = { path = "../umst-concrete-cartridge" }
umst-cli = { path = "../umst-cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.11", features = ["v4"] }

