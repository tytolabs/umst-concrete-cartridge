# Copyright (c) 2026 Santhosh Shyamsundar, Santosh Prabhu Shenbagamoorthy — Studio TYTO
#
# Stdio MCP server: sync JSON-RPC over lines; depends on `umst-cli` transport + `umst-concrete-cartridge` façade.

[package]
name = "umst-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol (MCP) server exposing the UMST concrete engine to AI agents."
publish = false
default-run = "umst-mcp"

[lib]
name = "umst_mcp"
path = "src/lib.rs"

[[bin]]
name = "umst-mcp"
path = "src/main.rs"

[[bin]]
name = "umst-mcp-rmcp"
path = "src/rmcp_main.rs"
required-features = ["rmcp-wire"]

[[test]]
name = "rmcp_parity"
path = "tests/rmcp_parity.rs"
required-features = ["rmcp-wire"]

[[test]]
name = "s7_proposed_tools"
path = "tests/s7_proposed_tools.rs"
required-features = ["agent-layer", "tool-dry-run", "tool-promote"]

[[test]]
name = "hcom_propose_communicative_act"
path = "tests/hcom_propose_communicative_act.rs"
required-features = ["agent-layer", "tool-semantic-hcom"]

[[test]]
name = "hcom_021_hybrid_orchestration"
path = "tests/hcom_021_hybrid_orchestration.rs"
required-features = ["agent-layer", "tool-propose-communicative-act"]

[[test]]
name = "hcom_029_semantic_agent_surface"
path = "tests/hcom_029_semantic_agent_surface.rs"
required-features = ["agent-layer", "tool-propose-communicative-act"]

[[test]]
name = "hcom_029_tools_surface"
path = "tests/hcom_029_tools_surface.rs"
required-features = ["agent-layer", "tool-propose-communicative-act"]

[features]
default = ["agent-layer"]
# GO-LIVE Step 3: agent-native-by-default → 13 core tools.
# S7 proposed tools + rmcp-wire remain DEFAULT-OFF (never in `default`).
blas-accelerate = ["umst-cli/blas-accelerate"]
agent-layer = ["umst-cli/agent-layer", "umst-concrete-cartridge/agent-layer", "arena-session"]
ucrs-provenance = ["umst-concrete-cartridge/ucrs-provenance"]
arena-session = ["dep:umst-runtime-arena"]
# S1: declarative ToolDescriptor manifest beside hand-rolled schemas (default off).
tool-manifest = []
# S3: official rmcp wire binary (default off); pulls agent-layer for gate/mi tools.
rmcp-wire = ["dep:rmcp", "dep:tokio", "agent-layer"]
# S7a: rich-violation enrichment on umst_gate_check (default off).
gate-explain-v2 = []
# S7b: read-only umst_dry_run tool (default off).
tool-dry-run = ["agent-layer"]
# S7c: umst_promote_contribution stub (default off).
tool-promote = ["agent-layer"]
# S7d: umst_arena_session unified wrapper (default off).
tool-arena-session-unified = ["agent-layer", "arena-session"]
# IDEA-004 / HCOM-029: propose_communicative_act schema + mock LLM stub (default off).
tool-semantic-hcom = ["agent-layer"]
# HCOM-021: full hybrid frontier + local gate via umst-semantics (default off).
tool-propose-communicative-act = ["agent-layer", "dep:umst-semantics", "dep:umst-gate", "dep:umst-trust"]
# WEB-009: web.propose_delta informational schema + honest mock (default off).
tool-web-propose-delta = ["agent-layer"]

[[test]]
name = "web_propose_delta"
path = "tests/web_propose_delta.rs"
required-features = ["agent-layer", "tool-web-propose-delta"]

[dependencies]
umst-agent-mcp-core = { path = "../umst-agent-mcp-core" }
umst-concrete-cartridge = { path = "../umst-concrete-cartridge" }
umst-cli = { path = "../umst-cli" }
umst-runtime-arena = { workspace = true, optional = true }
umst-semantics = { path = "../../../umst-semantics/crates/umst-semantics", default-features = false, features = ["p2-chair", "gate"], optional = true }
umst-gate = { workspace = true, optional = true }
umst-trust = { path = "../../../umst-foundations/crates/umst-trust", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.11", features = ["v4"] }
rmcp = { version = "2.2", optional = true, default-features = false, features = ["server", "transport-io", "schemars"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
sha2 = "0.10"
umst-manifold = { workspace = true }
