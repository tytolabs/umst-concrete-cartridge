[package]
name = "umst-concrete-cartridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/tytolabs/umst-concrete-cartridge"
autobenches = false
description = "Differentiable constitutive engine for cementitious materials, mounted on the UMST manifold."
documentation = "https://docs.rs/umst-concrete-cartridge"
homepage = "https://github.com/tytolabs/umst-concrete-cartridge"
readme = "../../README.md"
keywords = ["concrete", "materials", "thermodynamics", "constitutive", "burn"]
categories = ["science", "mathematics", "simulation"]
publish = false

[features]
default = []
# Lanes mirroring `umst-manifold` (Track I). Use `solver-experimental` for the full union.
solver-stable = ["umst-manifold/solver-stable"]
solver-research = ["umst-manifold/solver-research"]
# Mirrors `umst-manifold`'s `solver-experimental`: full opt-in solver stack (stable ∪ research).
# With this **off** (default), `ConcreteCartridge::compute_topology` keeps the heat-graph Laplacian path only.
solver-experimental = ["umst-manifold/solver-experimental"]
# Optional granular forwards (same names as `umst-manifold`); use when depending on a single kernel flag.
photonics-fdfd = ["umst-manifold/photonics-fdfd"]
electrochemistry-pnp = ["umst-manifold/electrochemistry-pnp"]
mechanics-adjoint = ["umst-manifold/mechanics-adjoint"]
statistical-mechanics-vinet = ["umst-manifold/statistical-mechanics-vinet"]
# CPU matmul speedup via Apple Accelerate when building on macOS (see README).
blas-accelerate = ["burn-ndarray/blas-accelerate", "umst-manifold/blas-accelerate"]
# Re-export typed [`UmstManifest`] from sibling-patched **`umst-manifold`** (`umst_manifold::manifest`).
# Default (**off**) keeps CI on the pinned git manifold.
# Typed `UmstManifest` + predict-path transition gate (no duplicate CD math in cartridge).
manifest-bridge = ["umst-manifold/manifest-bridge", "manifold-gate"]
# Thin façade forwards (requires matching `umst-manifold` revision or local `[patch]`).
manifold-manifest = ["umst-manifold/manifold-manifest"]
manifold-gate = ["umst-manifold/manifold-gate"]
# W9 Tier-2c SSOT + parity (requires patched `umst-manifold` w9 handshake; off in default CI).
tier2c-handshake = ["manifold-gate"]
# Optional ROS serde DTOs (no runtime ROS dep); forwards `umst_manifold::ros` when enabled.
ros2-contract = ["umst-manifold/ros2-contract"]
# Forwards manifold `catalog_schema_digest` field on UMST tensors in integration tests.
formal-witness = ["umst-manifold/formal-witness"]
# Virtual stack + extrusion proxies (Roussel / Bingham drivers); default off.
virtual-proxies = ["solver-research", "umst-manifold/rheology-bingham"]
# Track A/B optimisation loop: manifest CD + virtual proxies + local manifold patch.
proxy-loop = ["manifest-bridge", "virtual-proxies"]
# S2 B1 composed delegate — routes production api_consumer + gate through gate_route_composed.
# S5: consumer path deps are always linked; feature gates routing only.
b1-delegate = []
# Physical Reasoning Layer: gate-validated research memory + MCP contribute/query (default off).
agent-layer = ["manifest-bridge", "b1-delegate", "umst-cartridge-concrete/agent-layer", "dep:rusqlite", "dep:uuid", "dep:thiserror", "dep:sha2", "dep:serde_json", "dep:serde_yaml"]
# UCRS Tier-2 observation stamps on memory ingest (git-pinned `umst-ucrs`; local `[patch]` optional).
ucrs-provenance = ["agent-layer", "dep:umst-ucrs", "dep:umst-trust"]

[dependencies]
burn = { version = "=0.13.2", default-features = false, features = ["autodiff", "ndarray", "train"] }
burn-ndarray = "=0.13.2"
umst-jennings-legacy = { path = "../umst-jennings-legacy" }
umst-cartridge-api = { workspace = true }
umst-cartridge-concrete = { workspace = true }
umst-cartridge-continuum = { workspace = true }
umst-cartridge-solid-inelastic = { workspace = true }
umst-manifold = { workspace = true }
umst-cartridge-registry = { version = "0.0.0", path = "../../../umst-cartridge-registry" }
umst-chem = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
time = "0.3.47"
bincode = "=2.0.0-rc.3"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.30", features = ["bundled"], optional = true }
uuid = { version = "1.11", features = ["v4", "serde"], optional = true }
thiserror = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }
umst-ucrs = { workspace = true, optional = true, default-features = false }
umst-trust = { workspace = true, optional = true }

[dev-dependencies]
approx = "0.5"
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
walkdir = "2.5"

[lib]
name = "umst_concrete_cartridge"
path = "src/lib.rs"

