[package]
name = "umst-concrete-cartridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
autobenches = false
description = "Differentiable constitutive engine for cementitious materials, mounted on the UMST manifold."
documentation = "https://docs.rs/umst-concrete-cartridge"
homepage = "https://github.com/tytolabs/umst-concrete-cartridge"
readme = "../../README.md"
keywords = ["concrete", "materials", "thermodynamics", "constitutive", "burn"]
categories = ["science", "mathematics", "simulation"]

[features]
default = []

[dependencies]
burn = { version = "0.13.0", default-features = false }
burn-ndarray = "0.13.0"
umst-manifold = { git = "https://github.com/tytolabs/umst-manifold.git", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
time = "=0.3.36"
bincode = "=2.0.0-rc.3"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
approx = "0.5"
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit"] }
walkdir = "2.5"

[lib]
name = "umst_concrete_cartridge"
path = "src/lib.rs"

[[test]]
name = "formal_anchors"
path = "tests/formal_anchors.rs"

[[test]]
name = "proof_status_doc"
path = "tests/proof_status_doc.rs"

[[test]]
name = "realism_adversarial_physics"
path = "tests/realism/adversarial_physics.rs"

[[example]]
name = "hydration_simulation"
path = "examples/hydration_simulation.rs"
