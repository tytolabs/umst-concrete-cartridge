[package]
name = "umst-concrete-cartridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
autobenches = false
description = "Differentiable constitutive engine for cementitious materials, mounted on the UMST manifold."
documentation = "https://docs.rs/umst-concrete-cartridge"
homepage = "https://github.com/tytolabs/umst-concrete-cartridge"
readme = "../../README.md"
keywords = ["concrete", "materials", "thermodynamics", "constitutive", "burn"]
categories = ["science", "mathematics", "simulation"]
publish = false

[features]
default = []
# Lanes mirroring `umst-manifold` (Track I). Use `solver-experimental` for the full union.
solver-stable = ["umst-manifold/solver-stable"]
solver-research = ["umst-manifold/solver-research"]
# Mirrors `umst-manifold`'s `solver-experimental`: full opt-in solver stack (stable ∪ research).
# With this **off** (default), `ConcreteCartridge::compute_topology` keeps the heat-graph Laplacian path only.
solver-experimental = ["umst-manifold/solver-experimental"]
# Optional granular forwards (same names as `umst-manifold`); use when depending on a single kernel flag.
photonics-fdfd = ["umst-manifold/photonics-fdfd"]
electrochemistry-pnp = ["umst-manifold/electrochemistry-pnp"]
mechanics-adjoint = ["umst-manifold/mechanics-adjoint"]
statistical-mechanics-vinet = ["umst-manifold/statistical-mechanics-vinet"]
# CPU matmul speedup via Apple Accelerate when building on macOS (see README).
blas-accelerate = ["burn-ndarray/blas-accelerate", "umst-manifold/blas-accelerate"]
# Striatus-class shell demo (`optimize_shell_3d`): NPY artefact layout + renderer hook (binary still solver-only).
render = []

[dependencies]
burn = { version = "=0.13.2", default-features = false, features = ["autodiff", "ndarray", "train"] }
burn-ndarray = "0.13.0"
umst-manifold = { git = "https://github.com/tytolabs/umst-manifold.git", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
time = "=0.3.40"
bincode = "=2.0.0-rc.3"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
approx = "0.5"
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit"] }
walkdir = "2.5"

[lib]
name = "umst_concrete_cartridge"
path = "src/lib.rs"

[[test]]
name = "formal_anchors"
path = "tests/formal_anchors.rs"

[[test]]
name = "proof_status_doc"
path = "tests/proof_status_doc.rs"

[[test]]
name = "realism_adversarial_physics"
path = "tests/realism/adversarial_physics.rs"

[[example]]
name = "hydration_simulation"
path = "examples/hydration_simulation.rs"

[[example]]
name = "optimize_rc_beam"
path = "examples/optimize_rc_beam.rs"
# Phase 4 topology optimisation + phase-field fracture + Newmark mechanics
# all live behind solver-experimental in `umst-manifold`. Default builds
# do not compile this example.
required-features = ["solver-experimental"]

[[example]]
name = "optimize_shell_3d"
path = "examples/optimize_shell_3d.rs"
# Striatus-class 3D concrete shell topology demo (Phase 4 + extruded plate + Helmholtz / Heaviside / aug-Lagrangian).
required-features = ["solver-experimental", "render"]

[[test]]
name = "shell_demo_smoke"
path = "tests/shell_demo_smoke.rs"
required-features = ["solver-experimental"]

[[test]]
name = "shell_topology_rib_pattern"
path = "tests/shell_topology_rib_pattern.rs"
required-features = ["solver-experimental"]
