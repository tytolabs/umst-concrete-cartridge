[package]
name = "umst-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
autobenches = false
description = "Command-line front-end for the UMST concrete cartridge."
publish = false

[features]
default = []
proxy-loop = ["umst-concrete-cartridge/proxy-loop"]
manifest-bridge = ["umst-concrete-cartridge/manifest-bridge"]
agent-layer = ["umst-concrete-cartridge/agent-layer", "dep:uuid"]
blas-accelerate = [
    "umst-concrete-cartridge/blas-accelerate",
    "burn-ndarray/blas-accelerate",
    "umst-manifold/blas-accelerate",
]

[lib]
name = "umst_cli"
path = "src/lib.rs"

[dependencies]
umst-concrete-cartridge = { path = "../umst-concrete-cartridge" }
umst-manifold = { workspace = true }
burn = { version = "=0.13.2", default-features = false }
burn-ndarray = "=0.13.2"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
csv = "1.3"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
ryu = "1.0"
uuid = { version = "1.11", features = ["v4"], optional = true }

[dev-dependencies]
approx = "0.5"
assert_cmd = "2.0"
predicates = "3.1"
jsonschema = "0.26"
rand = "0.8"

[[bin]]
name = "umst-canonical"
path = "src/canonical_bin.rs"

[[bin]]
name = "umst"
path = "src/main.rs"

[[bin]]
name = "calibration_report"
path = "benches/calibration_report.rs"

[[test]]
name = "cli_predict"
path = "tests/predict.rs"

[[test]]
name = "cli_schema"
path = "tests/schema.rs"

[[test]]
name = "cli_audit"
path = "tests/audit.rs"

[[test]]
name = "cli_public_contract"
path = "tests/public_contract.rs"

[[test]]
name = "cli_ops_host"
path = "tests/ops_host.rs"

[[test]]
name = "calibration_migration_anchor"
path = "tests/calibration/migration_anchor.rs"

[[test]]
name = "calibration_profile_validity"
path = "tests/calibration/profile_validity.rs"

[[test]]
name = "calibration_regime_warnings"
path = "tests/calibration/regime_warnings.rs"

[[test]]
name = "calibration_dataset_metrics"
path = "tests/calibration/dataset_metrics.rs"

[[test]]
name = "calibration_ssot_row_counts"
path = "tests/calibration/ssot_row_counts.rs"

[[test]]
name = "proxy_loop_optimize"
path = "tests/proxy_loop_optimize.rs"
required-features = ["proxy-loop"]
