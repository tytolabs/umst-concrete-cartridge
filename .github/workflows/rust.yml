name: Rust

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Sibling-checkout pattern: cartridge depends on ../umst-manifold by path.
      - uses: actions/checkout@v4
        with:
          path: umst-concrete-cartridge
      - uses: actions/checkout@v4
        with:
          repository: tytolabs/umst-manifold
          path: umst-manifold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build
        working-directory: umst-concrete-cartridge
        run: cargo build --verbose

      - name: Tests
        working-directory: umst-concrete-cartridge
        run: cargo test --verbose

      - name: Clippy
        working-directory: umst-concrete-cartridge
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustfmt
        working-directory: umst-concrete-cartridge
        run: cargo fmt --all -- --check
