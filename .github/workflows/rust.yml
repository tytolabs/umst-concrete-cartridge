name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Cargo's libgit2 fetcher fails to anonymously clone public GitHub
  # repos in CI; fall back to the system git CLI which handles it.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  readme-sanity:
    name: README sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: README sanity (catch accidental wipes)
        run: |
          set -euo pipefail
          lines=$(wc -l < README.md)
          if [ "$lines" -lt 20 ]; then
            echo "FAIL: README.md is suspiciously short ($lines lines)"
            exit 1
          fi
          echo "OK: README.md has $lines lines"

  # Required job: build the library + run tests.
  # The Cargo.toml fetches umst-manifold from GitHub, so the manifold
  # repository must be public before this job goes green.
  build-test:
    name: build & test (ndarray backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Human audit: count or list Rust *doc-comment* formal_status buckets only — otherwise
      # `pub formal_status: String` (e.g. CertifyChain wire JSON) false-positives.
      #   grep -REn '^[[:space:]]*///[[:space:]]*formal_status:[[:space:]]*[A-Za-z]+' src/ --include='*.rs'
      - name: Formal-anchor hygiene (no boilerplate / retired tokens in Rust sources)
        run: |
          set -euo pipefail
          ! grep -REn 'Differentiable training' crates/ --include='*.rs'
          ! grep -REn 'formal_status:[[:space:]]*Library' crates/ --include='*.rs'
          ! grep -REn 'formal_status:[[:space:]]*Option' crates/ --include='*.rs'
          ! grep -REn 'formal_status:[[:space:]]*Boundary' crates/ --include='*.rs'

      - name: Vendor-name guard (README / notebooks)
        run: |
          set -euo pipefail
          for f in README.md notebooks/README.md crates/umst-mcp/README.md; do
            if grep -Ei '(comsol multiphysics|abaqus\s+finite)' "$f"; then
              echo "FAIL: benchmarking vendor token in $f"
              exit 1
            fi
          done

      - name: Build (default features, workspace)
        run: cargo build --workspace --verbose

      - name: Check all-features
        run: cargo check --workspace --all-features --verbose

      - name: Build examples
        run: cargo build --workspace --examples --verbose

      - name: Run tests (workspace)
        run: cargo test --workspace --verbose

      - name: MCP stdio smoke
        run: python3 scripts/mcp_smoke.py

      - name: Verify core crate default tree excludes transport deps (depth 1)
        run: |
          set -euo pipefail
          leaks=$(cargo tree -p umst-concrete-cartridge --no-default-features -e normal --depth 1 \
                   | grep -E '(tokio|clap|serde_json|csv|anyhow|thiserror|pyo3) ' || true)
          if [ -n "$leaks" ]; then
            echo "FAIL: forbidden deps leaked into umst-concrete-cartridge depth-1:"
            echo "$leaks"
            exit 1
          fi
          echo "OK: core cartridge default tree excludes pyo3/CLI/async/transport layers"

  # Advisory jobs: surface quality issues without blocking the merge.
  lint:
    name: clippy + rustfmt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  python-bindings-smoke:
    name: maturin develop (umst-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install "maturin>=1.7,<2"
      - name: maturin develop (tests extras: Hypothesis bindings smoke)
        run: maturin develop --release --manifest-path crates/umst-py/Cargo.toml --extras tests
