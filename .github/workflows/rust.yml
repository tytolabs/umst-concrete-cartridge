name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Cargo's libgit2 fetcher fails to anonymously clone public GitHub
  # repos in CI; fall back to the system git CLI which handles it.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Required job: build the library + run tests.
  # The Cargo.toml fetches umst-manifold from GitHub, so the manifold
  # repository must be public before this job goes green.
  build-test:
    name: build & test (ndarray backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build --verbose

      - name: Build examples
        run: cargo build --examples --verbose

      - name: Run tests (library default + optional CLI targets)
        run: cargo test --features cli --verbose

      - name: Verify optional deps stay out of default tree (depth 1)
        run: |
          set -euo pipefail
          # `toml` is an intentional library dependency for calibration parsing.
          # Block accidental CLI/async/csv leakage at depth 1 only (see Calibration plan step 12).
          leaks=$(cargo tree --no-default-features -e normal --depth 1 \
                   | grep -E '(tokio|clap|serde_json|csv|anyhow|thiserror) ' || true)
          if [ -n "$leaks" ]; then
            echo "FAIL: optional/forbidden deps leaked into default depth-1 tree:"
            echo "$leaks"
            exit 1
          fi
          echo "OK: no CLI/async/csv deps at default depth 1"

  # Advisory jobs: surface quality issues without blocking the merge.
  lint:
    name: clippy + rustfmt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --features cli -- -D warnings
