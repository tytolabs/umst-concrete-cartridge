name: Notebook

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  UMST_PRIVATE_CHECKOUT: ${{ secrets.UMST_PRIVATE_CHECKOUT }}
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Checkout private UMST siblings
        env:
          UMST_PRIVATE_CHECKOUT: ${{ secrets.UMST_PRIVATE_CHECKOUT }}
        run: bash .github/scripts/ci-checkout-siblings.sh
      - uses: ./.github/actions/setup-ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build umst CLI (release) + Python extension for notebooks
        run: |
          set -euo pipefail
          cargo build -p umst-cli --release
          python -m venv .venv
          .venv/bin/pip install -U pip maturin jupyter nbconvert matplotlib pandas
          .venv/bin/maturin develop --release --manifest-path crates/umst-py/Cargo.toml
      - run: chmod +x notebooks/run_all.sh
      - name: Execute notebooks
        run: |
          set -euo pipefail
          export PATH="${{ github.workspace }}/.venv/bin:${{ github.workspace }}/target/release:${PATH}"
          ./notebooks/run_all.sh --strict
