name: Notebook

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build umst CLI (release) + Python extension for notebooks
        run: |
          set -euo pipefail
          cargo build -p umst-cli --release
          python -m venv .venv
          .venv/bin/pip install -U pip maturin jupyter nbconvert matplotlib pandas
          .venv/bin/maturin develop --release --manifest-path crates/umst-py/Cargo.toml
      - run: chmod +x notebooks/run_all.sh
      - name: Execute notebooks
        run: |
          set -euo pipefail
          export PATH="${{ github.workspace }}/.venv/bin:${{ github.workspace }}/target/release:${PATH}"
          ./notebooks/run_all.sh --strict
