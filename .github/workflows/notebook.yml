name: Notebook

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build umst CLI (release) + Python extension for notebooks
        run: |
          cargo build -p umst-cli --release
          pip install maturin jupyter nbconvert matplotlib pandas
          cd crates/umst-py && maturin develop --release
      - run: chmod +x notebooks/run_all.sh
      - name: Execute notebooks
        run: PATH="${{ github.workspace }}/target/release:$PATH" ./notebooks/run_all.sh --strict
