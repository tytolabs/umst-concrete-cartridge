#
# S2: optional contracts generator check (continue-on-error until cutover).
# Hand docs/TOOL_CONTRACTS.md remains SSOT.

name: tool-contracts-gen

on:
  push:
    paths:
      - 'crates/umst-mcp/src/manifest/**'
      - 'docs/TOOL_CONTRACTS.md'
      - 'scripts/gen_tool_contracts.py'
      - '.github/workflows/tool-contracts-gen.yml'
  pull_request:
    paths:
      - 'crates/umst-mcp/src/manifest/**'
      - 'docs/TOOL_CONTRACTS.md'
      - 'scripts/gen_tool_contracts.py'
      - '.github/workflows/tool-contracts-gen.yml'

jobs:
  tool-contracts-gen:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Generate + --check vs hand SSOT
        run: |
          python3 scripts/gen_tool_contracts.py --out docs/TOOL_CONTRACTS.generated.md
          python3 scripts/gen_tool_contracts.py --check
      - name: Upload generated fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-contracts-generated
          path: docs/TOOL_CONTRACTS.generated.md
