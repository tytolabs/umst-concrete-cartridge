#
# Go-live Step 1: contracts generator --check is MANDATORY (generated == hand).

name: tool-contracts-gen

on:
  push:
    paths:
      - 'crates/umst-mcp/src/manifest/**'
      - 'docs/TOOL_CONTRACTS.md'
      - 'docs/TOOL_CONTRACTS.generated.md'
      - 'scripts/gen_tool_contracts.py'
      - '.github/workflows/tool-contracts-gen.yml'
  pull_request:
    paths:
      - 'crates/umst-mcp/src/manifest/**'
      - 'docs/TOOL_CONTRACTS.md'
      - 'docs/TOOL_CONTRACTS.generated.md'
      - 'scripts/gen_tool_contracts.py'
      - '.github/workflows/tool-contracts-gen.yml'

jobs:
  tool-contracts-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone private UMST siblings (foundations + cartridge-api)
        env:
          UMST_PRIVATE_CHECKOUT: ${{ secrets.UMST_PRIVATE_CHECKOUT }}
        run: |
          set -euo pipefail
          fsha=$(python3 -c "import tomllib; print(tomllib.load(open('.umst-pins.toml','rb'))['umst-foundations']['sha'])")
          asha=$(python3 -c "import tomllib; print(tomllib.load(open('.umst-pins.toml','rb'))['umst-cartridge-api']['sha'])")
          bash .github/scripts/checkout-umst-siblings.sh "umst-foundations@${fsha}" "umst-cartridge-api@${asha}"

      - name: Generate + mandatory --check (generated == hand)
        run: |
          python3 scripts/gen_tool_contracts.py --out docs/TOOL_CONTRACTS.generated.md
          python3 scripts/gen_tool_contracts.py --check
          # Fail if working tree would drift (committed generated/hand must match generator)
          git diff --exit-code -- docs/TOOL_CONTRACTS.generated.md docs/TOOL_CONTRACTS.md
      - name: Upload generated contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-contracts-generated
          path: docs/TOOL_CONTRACTS.generated.md
