name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  push-ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/tytolabs/umst-mcp:${{ github.ref_name }}
