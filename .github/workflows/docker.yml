name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Checkout public UMST siblings (Docker path deps)
        run: bash .github/scripts/ci-checkout-siblings.sh
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage public siblings into Docker build context
        run: |
          set -euo pipefail
          PARENT="$(dirname "${GITHUB_WORKSPACE}")"
          for repo in umst-foundations umst-cartridge-api umst-cartridges umst-chem umst-cartridge-registry umst-manifold umst-semantics umst-ucrs; do
            if [ ! -d "${PARENT}/${repo}" ]; then
              echo "::error::missing sibling ${PARENT}/${repo} (W-63: repo private or checkout failed)"
              exit 1
            fi
            rm -rf "${GITHUB_WORKSPACE}/${repo}"
            cp -a "${PARENT}/${repo}" "${GITHUB_WORKSPACE}/${repo}"
          done
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/tytolabs/umst-mcp:${{ github.ref_name }}
