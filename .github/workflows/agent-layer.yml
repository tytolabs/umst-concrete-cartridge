name: agent-layer

on:
  push:
    paths:
      - 'crates/umst-concrete-cartridge/src/research/**'
      - 'crates/umst-mcp/**'
      - 'fixtures/golden-adversarial/**'
      - 'examples/agent/**'
      - 'scripts/mcp_smoke.py'
      - '.github/workflows/agent-layer.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/umst-concrete-cartridge/src/research/**'
      - 'crates/umst-mcp/**'
      - 'fixtures/golden-adversarial/**'
      - 'examples/agent/**'
      - 'scripts/mcp_smoke.py'
      - '.github/workflows/agent-layer.yml'

jobs:
  agent-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone private UMST siblings (foundations + cartridge-api)
        env:
          UMST_PRIVATE_CHECKOUT: ${{ secrets.UMST_PRIVATE_CHECKOUT }}
        run: |
          set -euo pipefail
          fsha=$(python3 -c "import tomllib; print(tomllib.load(open('.umst-pins.toml','rb'))['umst-foundations']['sha'])")
          asha=$(python3 -c "import tomllib; print(tomllib.load(open('.umst-pins.toml','rb'))['umst-cartridge-api']['sha'])")
          bash .github/scripts/checkout-umst-siblings.sh "umst-foundations@${fsha}" "umst-cartridge-api@${asha}"


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Research memory + golden gate_check
        working-directory: .
        run: |
          cargo test -p umst-concrete-cartridge --features agent-layer \
            --test research_memory --test golden_gate_check --test phase8_adversarial

      - name: Bootstrap corpus row count (~16146)
        working-directory: .
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p = Path("fixtures/corpus/audit_corpus.v1.csv")
          if not p.exists():
              print("skip: audit_corpus.v1.csv not in checkout")
              raise SystemExit(0)
          with p.open(newline="") as f:
              n = sum(1 for _ in csv.reader(f)) - 1
          assert 16100 <= n <= 16200, f"expected ~16146 bootstrap rows, got {n}"
          print(f"bootstrap corpus rows: {n}")
          PY

      - name: Prebuild umst-mcp (agent-layer)
        working-directory: .
        run: cargo build -p umst-mcp --features agent-layer --quiet

      - name: MCP smoke (agent-layer)
        working-directory: .
        run: python3 scripts/mcp_smoke.py --agent-layer

      - name: Agent example smoke (01–08 — stdio, no Docker MCP)
        working-directory: .
        run: |
          python3 examples/agent/01_gate_explore.py
          python3 examples/agent/02_contribute_admissible.py
          # 03 needs a seeded DB; skip cleanly when absent (still CI-gated path)
          if [[ -f "${UMST_MEMORY_DB:-.umst-memory/memory.db}" ]]; then
            bash examples/agent/03_export_inbox.sh
          else
            echo "skip 03_export_inbox.sh (no UMST_MEMORY_DB)"
          fi
          python3 examples/agent/04_memory_query_batch.py
          python3 examples/agent/05_explain_violations.py
          python3 examples/agent/06_arena_batch.py
          python3 examples/agent/07_arena_mmap_load.py
          python3 examples/agent/08_arena_mcp_session.py
