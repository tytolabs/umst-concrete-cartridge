name: Setup UMST concrete-cartridge CI
description: Rust 1.88 toolchain and Swatinem cache (run sibling checkout step before this)
inputs:
  components:
    description: Optional rustup components (e.g. rustfmt, clippy)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
      with:
        toolchain: "1.88"
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
