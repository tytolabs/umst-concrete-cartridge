name: Setup UMST concrete-cartridge CI
description: Public sibling checkout (W-63), Rust 1.88 toolchain, Swatinem cache
inputs:
  components:
    description: Optional rustup components (e.g. rustfmt, clippy)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Checkout public UMST siblings (pinned SHAs, no credentials)
      shell: bash
      run: bash .github/scripts/ci-checkout-siblings.sh

    - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
      with:
        toolchain: "1.88"
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
