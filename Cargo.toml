[workspace]
resolver = "2"
members = [
    "crates/umst-concrete-cartridge",
    "crates/umst-concrete-ffi",
    "crates/umst-cli",
    "crates/umst-mcp",
    "crates/umst-py",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = [
    "Santhosh Shyamsundar <santhoshshyamsundar@tyto.studio>",
    "Santosh Prabhu Shenbagamoorthy",
]
repository = "https://github.com/tytolabs/umst-concrete-cartridge"

# Single CI pin for all workspace crates (bump after umst-manifold releases).
[workspace.dependencies]
umst-manifold = { git = "https://github.com/tytolabs/umst-manifold.git", rev = "67001e5754fadc72f56f9cae51d6bb81c559f5d9" }
umst-ucrs = { git = "https://github.com/tytolabs/umst-ucrs.git", rev = "c83b765ac392b2688eddf87e2e4b2bf204c15fbe" }

# Local dev: copy `.cargo/config.toml.example` → `.cargo/config.toml` to patch sibling umst-manifold.

# Striatus dev loop: keep harness code debuggable; compile Burn/ndarray deps at full speed.
[profile.dev.package."*"]
opt-level = 3
