[workspace]
resolver = "2"
members = [
    "crates/umst-agent-mcp-core",
    "crates/umst-concrete-cartridge",
    "crates/umst-concrete-ffi",
    "crates/umst-cli",
    "crates/umst-mcp",
    "crates/umst-py",
]

# S4 Layer-0 FFI held OUT of default workspace clippy matrix (depends on
# cartridge `agent-layer`, which trips workspace `-D warnings`). Run parity with:
#   cargo test --manifest-path crates/umst-gate-ffi/Cargo.toml
exclude = [
    "crates/umst-gate-ffi",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = [
    "Santhosh Shyamsundar <santhoshshyamsundar@tyto.studio>",
    "Santosh Prabhu Shenbagamoorthy",
]
repository = "https://github.com/tytolabs/umst-concrete-cartridge"

# Single CI pin for all workspace crates (bump after umst-manifold releases).
[workspace.dependencies]
umst-manifold = { git = "https://github.com/tytolabs/umst-manifold.git", rev = "35bf75f5b99835265c40d343bd6a88bb629dff7f" }
umst-runtime-arena = { git = "https://github.com/tytolabs/umst-manifold.git", rev = "35bf75f5b99835265c40d343bd6a88bb629dff7f", package = "umst-runtime-arena" }
umst-ucrs = { git = "https://github.com/tytolabs/umst-ucrs.git", rev = "eda7ac052a05cff82e64027799ad42124872518a" }

# Local dev: copy `.cargo/config.toml.example` → `.cargo/config.toml` to patch sibling umst-manifold.

# Striatus dev loop: keep harness code debuggable; compile Burn/ndarray deps at full speed.
[profile.dev.package."*"]
opt-level = 3
