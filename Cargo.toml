[workspace]
resolver = "2"
members = [
    "crates/umst-agent-mcp-core",
    "crates/umst-concrete-cartridge",
    "crates/umst-concrete-ffi",
    "crates/umst-cli",
    "crates/umst-gate-ffi",
    "crates/umst-mcp",
    "crates/umst-py",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = [
    "Santhosh Shyamsundar <santhoshshyamsundar@tyto.studio>",
    "Santosh Prabhu Shenbagamoorthy",
]
repository = "https://github.com/tytolabs/umst-concrete-cartridge"

# Single CI pin for all workspace crates (bump after umst-manifold releases).
[workspace.dependencies]
umst-cartridge-api = { path = "../umst-cartridge-api" }
umst-manifold = { git = "https://github.com/tytolabs/umst-manifold.git", rev = "1b92a6a297e95522b3cdb36c92d7f5bffb0270ee" }
umst-runtime-arena = { git = "https://github.com/tytolabs/umst-manifold.git", rev = "1b92a6a297e95522b3cdb36c92d7f5bffb0270ee", package = "umst-runtime-arena" }
umst-ucrs = { git = "https://github.com/tytolabs/umst-ucrs.git", rev = "229294ebd8a7a4349762d4470f1a3aafaea07bed" }

# Local dev: copy `.cargo/config.toml.example` → `.cargo/config.toml` to patch sibling umst-manifold.

# Striatus dev loop: keep harness code debuggable; compile Burn/ndarray deps at full speed.
[profile.dev.package."*"]
opt-level = 3
