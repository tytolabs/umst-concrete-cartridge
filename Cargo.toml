[workspace]
resolver = "2"
members = [
    "crates/umst-concrete-cartridge",
    "crates/umst-cli",
    "crates/umst-mcp",
    "crates/umst-py",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = [
    "Santhosh Shyamsundar <santhoshshyamsundar@tyto.studio>",
    "Santosh Prabhu Shenbagamoorthy",
]
repository = "https://github.com/tytolabs/umst-concrete-cartridge"

# Single CI pin for all workspace crates (bump after umst-manifold releases).
[workspace.dependencies]
umst-manifold = { git = "https://github.com/tytolabs/umst-manifold.git", rev = "6124af485e1ee7a8681df936510a9ca47ff850d2" }

# Local dev: live manifold edits on feat/proxy-loop (CI uses git rev pin only).
[patch."https://github.com/tytolabs/umst-manifold.git"]
umst-manifold = { path = "../umst-manifold" }
