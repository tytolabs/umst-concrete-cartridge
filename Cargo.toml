[workspace]
resolver = "2"
members = [
    "crates/umst-concrete-cartridge",
    "crates/umst-cli",
    "crates/umst-mcp",
    "crates/umst-py",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = [
    "Santhosh Shyamsundar <santhoshshyamsundar@tyto.studio>",
    "Santosh Prabhu Shenbagamoorthy",
]
repository = "https://github.com/tytolabs/umst-concrete-cartridge"

# Crates depend on `umst-manifold` via `git` + `branch = "main"`. For a local sibling checkout,
# add `[patch."https://github.com/tytolabs/umst-manifold.git"]` with `path = "..."` in
# `.cargo/config.toml` here (gitignored) — do not commit a `[patch]` with `../umst-manifold`
# in this file or GitHub Actions cannot resolve the dependency.
