[workspace]
resolver = "2"
members = [
    "crates/umst-concrete-cartridge",
    "crates/umst-cli",
    "crates/umst-mcp",
    "crates/umst-py",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = [
    "Santhosh Shyamsundar <santhoshshyamsundar@tyto.studio>",
    "Santosh Prabhu Shenbagamoorthy",
]
repository = "https://github.com/tytolabs/umst-concrete-cartridge"

# Single CI pin for all workspace crates (bump after umst-manifold releases).
[workspace.dependencies]
umst-manifold = { git = "https://github.com/tytolabs/umst-manifold.git", rev = "9b249ec908d2f7d9562f880b65a7cf9ed1c2b2ca" }

# Local dev: copy `.cargo/config.toml.example` → `.cargo/config.toml` to patch sibling umst-manifold.
