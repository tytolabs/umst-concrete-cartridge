[package]
name = "umst-concrete-cartridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
autobenches = false
authors = [
    "Santhosh Shyamsundar <santhoshshyamsundar@gmail.com>",
    "Santosh Prabhu Shenbagamoorthy",
    "Studio TYTO",
]
description = "Differentiable constitutive engine for cementitious materials, mounted on the UMST manifold."
documentation = "https://docs.rs/umst-concrete-cartridge"
homepage = "https://github.com/tytolabs/umst-concrete-cartridge"
repository = "https://github.com/tytolabs/umst-concrete-cartridge"
license = "MIT"
readme = "README.md"
keywords = ["concrete", "materials", "thermodynamics", "constitutive", "burn"]
categories = ["science", "mathematics", "simulation"]

[features]
default = []
cli = ["dep:clap", "dep:serde_json", "dep:anyhow"]
calibration = ["dep:sha2", "dep:csv"]

[dependencies]
# Differentiable physics on the burn tensor framework.
burn = { version = "0.13.0", default-features = false }
burn-ndarray = "0.13.0"

# UMST manifold substrate (git so CI and standalone clones resolve).
umst-manifold = { git = "https://github.com/tytolabs/umst-manifold.git", branch = "master" }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }

clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
thiserror = "1.0"

toml = "0.8"
sha2 = { version = "0.10", optional = true }
csv = { version = "1.3", optional = true }

# Pinned for upstream MSRV compatibility.
time = "=0.3.36"
bincode = "=2.0.0-rc.3"

# Numerics & utilities.
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
approx = "0.5"
assert_cmd = "2.0"
predicates = "3.1"
jsonschema = "0.26"
serde_json = "1.0"
csv = "1.3"
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit"] }
walkdir = "2.5"

[lib]
name = "umst_concrete_cartridge"
path = "src/lib.rs"

[[bin]]
name = "umst"
path = "src/bin/umst.rs"
required-features = ["cli"]

[[bin]]
name = "calibration_report"
path = "benches/calibration_report.rs"
required-features = ["cli", "calibration"]

[[test]]
name = "cli_predict"
path = "tests/cli/predict.rs"
required-features = ["cli"]

[[test]]
name = "cli_schema"
path = "tests/cli/schema.rs"
required-features = ["cli"]

[[test]]
name = "cli_public_contract"
path = "tests/cli/public_contract.rs"
required-features = ["cli"]

[[test]]
name = "formal_anchors"
path = "tests/formal_anchors.rs"

[[test]]
name = "calibration_migration_anchor"
path = "tests/calibration/migration_anchor.rs"
required-features = ["cli"]

[[test]]
name = "calibration_profile_validity"
path = "tests/calibration/profile_validity.rs"

[[test]]
name = "calibration_regime_warnings"
path = "tests/calibration/regime_warnings.rs"
required-features = ["cli"]

[[test]]
name = "calibration_dataset_metrics"
path = "tests/calibration/dataset_metrics.rs"
required-features = ["cli"]

[[test]]
name = "calibration_ssot_row_counts"
path = "tests/calibration/ssot_row_counts.rs"

[[test]]
name = "proof_status_doc"
path = "tests/proof_status_doc.rs"

[[test]]
name = "realism_adversarial_physics"
path = "tests/realism/adversarial_physics.rs"

[[example]]
name = "hydration_simulation"
path = "examples/hydration_simulation.rs"
