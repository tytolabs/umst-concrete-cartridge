[package]
name = "umst-concrete-cartridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = [
    "Santhosh Shyamsundar <santhoshshyamsundar@gmail.com>",
    "Santosh Prabhu Shenbagamoorthy",
    "Studio TYTO",
]
description = "Differentiable constitutive engine for cementitious materials, mounted on the UMST manifold."
documentation = "https://docs.rs/umst-concrete-cartridge"
homepage = "https://github.com/tytolabs/umst-concrete-cartridge"
repository = "https://github.com/tytolabs/umst-concrete-cartridge"
license = "MIT"
readme = "README.md"
keywords = ["concrete", "materials", "thermodynamics", "constitutive", "burn"]
categories = ["science", "mathematics", "simulation"]

[dependencies]
# Differentiable physics on the burn tensor framework.
burn = { version = "0.13.0", default-features = false }
burn-ndarray = "0.13.0"

# UMST manifold substrate (git so CI and standalone clones resolve).
# For local co-development with a sibling checkout, use `cargo patch` or swap to `path`:
# umst-manifold = { path = "../umst-manifold" }
umst-manifold = { git = "https://github.com/tytolabs/umst-manifold.git", branch = "master" }

# Serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (used by the optional API surface).
tokio = { version = "1.36", features = ["full"] }

# Pinned for upstream MSRV compatibility.
time = "=0.3.36"
bincode = "=2.0.0-rc.3"

# Numerics & utilities.
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
approx = "0.5"

[lib]
name = "umst_concrete_cartridge"
path = "src/lib.rs"

[[example]]
name = "hydration_simulation"
path = "examples/hydration_simulation.rs"
