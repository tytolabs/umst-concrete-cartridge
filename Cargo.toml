[workspace]
resolver = "2"
members = [
    "crates/umst-agent-mcp-core",
    "crates/umst-concrete-cartridge",
    "crates/umst-jennings-legacy",
    "crates/umst-concrete-ffi",
    "crates/umst-cli",
    "crates/umst-gate-ffi",
    "crates/umst-mcp",
    "crates/umst-py",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = [
    "Santhosh Shyamsundar <santhoshshyamsundar@tyto.studio>",
    "Santosh Prabhu Shenbagamoorthy",
]
repository = "https://github.com/tytolabs/umst-concrete-cartridge"

# Single CI pin for all workspace crates (bump after umst-manifold releases).
[workspace.dependencies]
umst-cartridge-api = { version = "0.1.0", path = "../umst-cartridge-api" }
# S5 path-dep bridge — full B1+B2+B3 compose stack reachable from monolith workspace.
umst-cartridge-concrete = { version = "0.1.0", path = "../umst-cartridges/crates/materials/umst-cartridge-concrete" }
umst-cartridge-continuum = { version = "0.1.0", path = "../umst-cartridges/crates/atoms/umst-cartridge-continuum" }
umst-cartridge-solid-inelastic = { version = "0.1.0", path = "../umst-cartridges/crates/atoms/umst-cartridge-solid-inelastic" }
umst-cartridge-poromechanics = { version = "0.1.0", path = "../umst-cartridges/crates/atoms/umst-cartridge-poromechanics" }
umst-gate = { version = "0.1.0", path = "../umst-foundations/crates/umst-gate" }
umst-trust = { version = "0.1.0", path = "../umst-foundations/crates/umst-trust" }
umst-manifold = { git = "https://github.com/tytolabs/umst-manifold.git", rev = "575d9508f872e6c5ae3d5fc9fe3bfcb1f44d5ab1" }
umst-runtime-arena = { git = "https://github.com/tytolabs/umst-manifold.git", rev = "575d9508f872e6c5ae3d5fc9fe3bfcb1f44d5ab1", package = "umst-runtime-arena" }
umst-ucrs = { git = "https://github.com/tytolabs/umst-ucrs.git", rev = "a1202338638241749daa226855f682fd73f8f872", default-features = false }
umst-chem = { version = "0.1.0", path = "../umst-chem" }
[patch."https://github.com/tytolabs/umst-ucrs.git"]
umst-ucrs = { version = "1.0.0", path = "../umst-ucrs/Rust" }

# R2-1: tracked sibling patch so gate_parity resolves umst-gate after A2 carve.
# Pure git pin 575d9508 alone fails ("no matching package named umst-gate") because
# the remote rev predates the carve; local umst-manifold path-deps foundations.
# See umst-foundations/crates/umst-gate/CONSUMER_PATH.md.
[patch."https://github.com/tytolabs/umst-manifold.git"]
umst-manifold = { path = "../umst-manifold" }
umst-runtime = { path = "../umst-manifold/crates/umst-runtime" }
umst-runtime-arena = { path = "../umst-manifold/umst-runtime-arena" }

# Striatus dev loop: keep harness code debuggable; compile Burn/ndarray deps at full speed.
[profile.dev.package."*"]
opt-level = 3
